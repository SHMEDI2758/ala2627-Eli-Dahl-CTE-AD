<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eli Dahl Track Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">Athletic History</p>
      <h1>PB</h1>
      <p class="subtitle">Personal Bests</p>
    </header>

    <section id="pb-results-section" class="results-section">
      <h2>PB</h2>
      <div id="pb-results" class="results"></div>
    </section>

    <section id="results" class="results"></section>
  </main>

  <script src="data.js"></script>
  <script>
    const resultsContainer = document.getElementById('results');
    const pbResultsContainer = document.getElementById('pb-results');
    const eventGroups = new Map();

    trackResults.forEach((entry) => {
      if (!eventGroups.has(entry.event)) {
        eventGroups.set(entry.event, []);
      }
      eventGroups.get(entry.event).push(entry);
    });

    const createTableSection = (title, group, includeEventColumn = false) => {
      const section = document.createElement('section');
      section.className = 'event-group';

      const heading = document.createElement('h2');
      heading.textContent = title;
      section.appendChild(heading);

      const table = document.createElement('table');
      const headerCells = includeEventColumn
        ? ['Event', 'Date', 'Meet', 'Athlete / Relay', 'School', 'Mark', 'Grade']
        : ['Date', 'Meet', 'Athlete / Relay', 'School', 'Mark', 'Grade'];

      table.innerHTML = `
          <thead>
            <tr>
              ${headerCells.map((cell) => `<th>${cell}</th>`).join('')}
            </tr>
          </thead>
        `;

      const tbody = document.createElement('tbody');

      group.forEach((entry) => {
        const row = document.createElement('tr');
        const isPbRow = /\bPB\b/i.test(entry.mark);
        const isSbRow = /\bSB\b/i.test(entry.mark);
        if (isPbRow) {
          row.classList.add('pb-row');
        }
        if (isSbRow) {
          row.classList.add('sb-row');
        }

        const rowContent = includeEventColumn
          ? `
              <td data-label="Event">${entry.event}</td>
              <td data-label="Date">${entry.date}</td>
              <td data-label="Meet">${entry.meet}</td>
              <td data-label="Athlete / Relay">${entry.athlete}</td>
              <td data-label="School">${entry.team}</td>
              <td data-label="Mark">${entry.mark}</td>
              <td data-label="Grade">${entry.grade}</td>
            `
          : `
              <td data-label="Date">${entry.date}</td>
              <td data-label="Meet">${entry.meet}</td>
              <td data-label="Athlete / Relay">${entry.athlete}</td>
              <td data-label="School">${entry.team}</td>
              <td data-label="Mark">${entry.mark}</td>
              <td data-label="Grade">${entry.grade}</td>
            `;
        row.innerHTML = rowContent;
        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      section.appendChild(table);
      return section;
    };

    const pbEntriesByEvent = new Map();
    trackResults.forEach((entry) => {
      if (!/\bPB\b/i.test(entry.mark)) {
        return;
      }

      const currentBest = pbEntriesByEvent.get(entry.event);
      if (!currentBest || Number(entry.sortValue ?? Infinity) < Number(currentBest.sortValue ?? Infinity)) {
        pbEntriesByEvent.set(entry.event, entry);
      }
    });

    const pbEntries = [...pbEntriesByEvent.values()].filter((entry) =>
      ['1 Mile', '1600 Meters', '800 Meters', '3200 Meters'].includes(entry.event)
    );
    if (pbEntries.length) {
      const pbGroup = [...pbEntries].sort((a, b) => {
        const aTime = Number(a.sortValue ?? Infinity);
        const bTime = Number(b.sortValue ?? Infinity);
        return aTime - bTime;
      });
      pbResultsContainer.appendChild(createTableSection('PB', pbGroup, true));
    }

    const allowedEvents = new Set(['1 Mile', '1600 Meters', '800 Meters', '3200 Meters']);

    [...eventGroups.keys()]
      .filter((eventName) => allowedEvents.has(eventName))
      .sort((a, b) => a.localeCompare(b))
      .forEach((eventName) => {
        const group = [...eventGroups.get(eventName)]
          .sort((a, b) => {
            const aTime = Number(a.sortValue ?? Infinity);
            const bTime = Number(b.sortValue ?? Infinity);
            return aTime - bTime;
          });

        resultsContainer.appendChild(createTableSection(eventName, group));
      });
  </script>
</body>

</html>
