<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Totally Pointless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">?</span>
      <span>totally pointless</span>
    </div>
    <a class="nav-link" href="../index.html">back to portfolio</a>
  </header>

  <main class="hero">
    <p class="eyebrow">welcome to the internet for no reason</p>
    <h1>There is no goal here.</h1>
    <p class="subtitle">
      This site exists to waste a little time, make you smile, and prove that the web can be delightfully absurd.
    </p>

    <div class="cta-wrap">
      <button id="goBtn" class="main-btn" type="button">Take me somewhere useless</button>
      <button id="surpriseBtn" class="ghost-btn" type="button">Make it weirder</button>
    </div>

    <div class="status-panel">
      <span class="status-label">last action</span>
      <p id="statusText">waiting for a meaningless adventure...</p>
    </div>
  </main>
</body>

<script src="script.js"></script>

</html>
