<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minesweeper Hard Mode</title>
  <link rel="stylesheet" href="minesweeper.css" />
</head>

<body>
  <div class="page">
    <div class="panel">
      <h1>Minesweeper</h1>
      <div class="topbar">
        <span id="status">Hard Mode</span>
        <div class="controls">
          <div id="mine-count" class="mine-counter">Mines Left: 30</div>
          <div class="mode-switcher" aria-label="Difficulty selection">
            <button class="mode-btn" type="button" data-mode="easy">Easy</button>
            <button class="mode-btn" type="button" data-mode="medium">Medium</button>
            <button class="mode-btn active" type="button" data-mode="hard">Hard</button>
          </div>
          <button id="reset" type="button">New Game</button>
        </div>
      </div>
      <div id="board" class="board" aria-label="Minesweeper board"></div>
      <p class="instructions">
        Click to clear a square. Press M to flag the selected square.
      </p>
    </div>
  </div>

  <script src="minesweeper.js"></script>
</body>

</html>
