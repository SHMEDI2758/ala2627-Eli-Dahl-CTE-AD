<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catch Notes | Fishing Records</title>
  <link rel="stylesheet" href="styles.css">
  <!-- The console panel: shows console.log messages and errors at the bottom of the page,
       because school Chromebooks block the browser's own console.
       DAY 4: delete this one line before you ship, so your live site shows only your page. -->
  <script src="console-panel.js" defer></script>
  <!-- This line connects your JavaScript. "defer" means: wait until the page has loaded, then run it. Do not delete it. -->
  <script src="script.js" defer></script>
</head>

<body>
  <!--
    MY CONTRACT FOR THE WEEK
    My topic: a fishing catalog for keeping catch records
    My colours: blue spruce and mint
    My headline: Keep every catch in the record
    The one thing only my site does: save the details that make each trip memorable
  -->

  <header class="top">
    <p class="kicker">Catch Notes</p>
    <h1>Keep every catch in the record</h1>
    <p class="tagline">A simple fishing catalog for remembering the fish, the water, and the story behind every trip.
    </p>
  </header>

  <main class="cards">
    <section class="card feature">
      <h2>Jump game</h2>
      <button id="action" type="button">Jump</button>
      <p id="output">The cube is waiting to jump.</p>
    </section>
  </main>

  <footer class="bottom">
    <p>Built for anglers who remember the details.</p>
  </footer>
</body>

</html>
